<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#f4f0e8">
		<title>Nearbit | Conversa local</title>
		<link rel="stylesheet" href="/css/reset.css">
		<link rel="stylesheet" href="/css/variables.css">
		<link rel="stylesheet" href="/css/layout.css">
		<link rel="stylesheet" href="/css/components.css">
		<link rel="stylesheet" href="/css/responsive.css">
	</head>
	<body>
		<main class="app-shell">
			<section class="join-screen" id="join-screen" aria-labelledby="join-title">
				<div class="join-copy">
					<p class="eyebrow">REDE LOCAL · SEM NUVEM</p>
					<h1 id="join-title">Converse perto.</h1>
					<p class="intro">Uma sala simples para as pessoas conectadas ao mesmo Wi-Fi.</p>
				</div>
				<form class="join-form" id="join-form">
					<label for="username">Como você quer aparecer?</label>
					<div class="input-row">
						<input id="username" name="username" type="text" maxlength="24" autocomplete="nickname" placeholder="Seu nome" required>
						<button type="submit">Entrar <span aria-hidden="true">↗</span></button>
					</div>
					<p class="form-error" id="join-error" role="alert"></p>
				</form>
				<p class="join-note"><span class="status-dot"></span> Esta conversa fica na rede local.</p>
			</section>

			<section class="chat-screen is-hidden" id="chat-screen" aria-label="Conversa Nearbit">
				<header class="topbar">
					<a class="brand" href="/" aria-label="Nearbit início">near<span>bit</span></a>
					<div class="connection" id="connection-status"><span class="status-dot"></span><span id="connection-label">Conectando</span></div>
					<button class="icon-button" id="leave-button" type="button" title="Sair da conversa" aria-label="Sair da conversa">×</button>
				</header>
				<div class="chat-layout">
					<section class="conversation">
						<div class="conversation-heading">
							<div>
								<p class="eyebrow">SALA ABERTA</p>
								<h2>Agora, por perto</h2>
							</div>
							<span class="online-count" id="online-count">0 online</span>
						</div>
						<div class="messages" id="messages" aria-live="polite" aria-label="Mensagens"></div>
						<p class="typing" id="typing-indicator" aria-live="polite"></p>
						<form class="message-form" id="message-form">
							<label class="sr-only" for="message-input">Escreva uma mensagem</label>
							<input id="message-input" type="text" maxlength="500" placeholder="Escreva uma mensagem..." autocomplete="off">
							<button type="submit" title="Enviar mensagem" aria-label="Enviar mensagem">↑</button>
						</form>
					</section>
					<aside class="people-panel" aria-label="Pessoas online">
						<div class="panel-heading"><span>Pessoas aqui</span><span class="panel-count" id="panel-count">0</span></div>
						<ul class="user-list" id="user-list"></ul>
						<p class="panel-footnote">Somente quem está nesta rede pode entrar.</p>
					</aside>
				</div>
			</section>
		</main>
		<script type="module" src="/js/app.js"></script>
	</body>
</html>
